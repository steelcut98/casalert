<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CasAlerts brick + CA monogram favicon - HIGH CONTRAST version -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Marcellus&amp;display=swap');

      .brick-body { fill: #6f5037; stroke: #563d2c; stroke-width: 1.5; }
      .brick-mortar { stroke: #563d2c; stroke-width: 0.8; opacity: 0.4; }
      .ca-text {
        font-family: 'Marcellus', 'Times New Roman', 'Georgia', serif;
        font-size: 30px;
        fill: #ffffff;
        stroke: #ffffff;
        stroke-width: 0.8;
        text-anchor: middle;
        dominant-baseline: central;
        letter-spacing: -2px;
      }

      @media (prefers-color-scheme: dark) {
        .brick-body { fill: #b48b65; stroke: #cdb191; }
        .brick-mortar { stroke: #8f6a47; opacity: 0.5; }
        .ca-text { fill: #1a0f08; stroke: #1a0f08; }
      }
    </style>
  </defs>

  <rect class="brick-body" x="4" y="14" width="56" height="36" rx="3" />
  <line class="brick-mortar" x1="4" y1="32" x2="60" y2="32" />
  <line class="brick-mortar" x1="22" y1="14" x2="22" y2="32" />
  <line class="brick-mortar" x1="42" y1="32" x2="42" y2="50" />

  <text class="ca-text" x="32" y="33">CA</text>
</svg>
