<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Walnut Brick CasAlerts favicon (full detail version for 32x32 and up) -->
  <!-- Light mode default; dark mode uses prefers-color-scheme media query -->
  <style>
    .brick-body { fill: #6f5037; stroke: #563d2c; stroke-width: 2; }
    .brick-mortar { stroke: #563d2c; stroke-width: 1; opacity: 0.5; }
    @media (prefers-color-scheme: dark) {
      .brick-body { fill: #b48b65; stroke: #cdb191; }
      .brick-mortar { stroke: #cdb191; }
    }
  </style>
  <rect class="brick-body" x="4" y="14" width="56" height="36" rx="3" />
  <line class="brick-mortar" x1="4" y1="32" x2="60" y2="32" />
  <line class="brick-mortar" x1="22" y1="14" x2="22" y2="32" />
  <line class="brick-mortar" x1="42" y1="32" x2="42" y2="50" />
</svg>
